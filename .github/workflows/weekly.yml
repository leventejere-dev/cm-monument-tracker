name: Actualizare saptamanala (radar monumente)

on:
  schedule:
    - cron: "30 2 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch signals and update index.html
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python weekly_update.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "cm-radar-bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.html
            git commit -m "Actualizare automata: semnale noi"
            git push
          else
            echo "no changes this run"
          fi
