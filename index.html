/* ============================================================================

  --gold:#C0A062; --gold-faded:#E1D1B4; --silver:#939598; --silver-faded:#D1CECD;

  --ok:#7FB08A; --warn:var(--orange); --danger:#C97A6D; --info:var(--silver-faded);

/* scrollbar */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#3a3a40;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#4a4a52}
::-webkit-scrollbar-track{background:transparent}

/* ---------------------------------------------------------------- layout */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:var(--header-h) 1fr;
  grid-template-areas:"side head" "side main";height:100vh}
.sidebar{grid-area:side;background:linear-gradient(180deg,#151517,#1b1b1e);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
.topbar{grid-area:head;background:var(--bg-1);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 22px}
.main{grid-area:main;overflow-y:auto;padding:24px 26px 60px}

/* ---------------------------------------------------------------- sidebar */
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.brand img{height:26px;width:auto;display:block}
.brand .sub{font-size:9.5px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;font-weight:600;margin-top:3px}
.nav{padding:12px 10px;flex:1;overflow-y:auto}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-sm);
  color:var(--tx-1);font-weight:500;font-size:13.5px;margin-bottom:2px;cursor:pointer;
  border:1px solid transparent;transition:.12s}
.nav a:hover{background:var(--bg-2);text-decoration:none;color:var(--tx-0)}
.nav a.active{background:linear-gradient(90deg,rgba(192,160,98,.16),rgba(192,160,98,.03));
  color:var(--white);border-color:var(--gold-line)}
.nav a.active .ic{color:var(--gold)}
.nav .ic{width:18px;height:18px;flex:0 0 18px;color:var(--tx-2)}
.nav .sect{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx-3);
  padding:14px 12px 6px;font-weight:600}
.nav a .badge{margin-left:auto}
.sidebar-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--tx-3)}
.sidebar-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}

/* ---------------------------------------------------------------- topbar */
.search-wrap{flex:1;max-width:560px;position:relative}
.search-wrap input{width:100%;background:var(--bg-2);border:1px solid var(--line-strong);color:var(--tx-0);
  border-radius:22px;padding:9px 150px 9px 38px;font-size:13.5px;outline:none;transition:.15s;text-overflow:ellipsis}
.search-wrap input:focus{border-color:var(--gold-line);background:var(--bg-3)}
.search-wrap .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tx-2)}
.search-wrap .nlp{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;
  letter-spacing:.5px;color:var(--tx-3);border:1px solid var(--line);border-radius:10px;padding:2px 7px}
.topbar .spacer{flex:1}
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:20px;padding:2px}
.seg button{background:transparent;border:0;color:var(--tx-2);padding:5px 12px;border-radius:16px;
  cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.3px}
.seg button.active{background:var(--gold);color:#1c1c14}
.role-sel{background:var(--bg-2);border:1px solid var(--line);color:var(--tx-1);border-radius:8px;
  padding:7px 10px;font-size:12.5px;cursor:pointer;font-family:inherit}
.icon-btn{background:var(--bg-2);border:1px solid var(--line);color:var(--tx-1);width:36px;height:36px;
  border-radius:9px;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--gold-line);color:var(--gold)}

/* ---------------------------------------------------------------- generic */
.page-title{display:flex;align-items:flex-end;gap:14px;margin-bottom:4px}
.page-title h1{font-size:23px}
.page-title .cap{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:600}
.page-sub{color:var(--tx-2);font-size:13px;margin:2px 0 22px}
.demo-banner{display:flex;gap:10px;align-items:flex-start;background:rgba(244,180,34,.08);
  border:1px solid rgba(244,180,34,.3);border-radius:var(--radius);padding:10px 14px;margin-bottom:20px;
  font-size:12.5px;color:var(--orange-faded)}
.demo-banner svg{flex:0 0 18px;color:var(--orange);margin-top:1px}

.card{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card.pad0{padding:0;overflow:hidden}
.grid{display:grid;gap:16px}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.section-h h2{font-size:16px;letter-spacing:.3px}
.section-h .hint{color:var(--tx-3);font-size:12px}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px}
.kpi{background:linear-gradient(160deg,var(--bg-2),var(--bg-1));border:1px solid var(--line);
  border-radius:var(--radius);padding:15px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle,rgba(192,160,98,.10),transparent 70%)}
.kpi .k-lab{font-size:11.5px;color:var(--tx-2);font-weight:500;line-height:1.35;min-height:31px}
.kpi .k-val{font-size:27px;font-weight:700;margin-top:8px;letter-spacing:.5px}
.kpi .k-sub{font-size:11px;margin-top:3px;color:var(--tx-3)}
.kpi.accent .k-val{color:var(--gold)}
.kpi.hot .k-val{color:var(--orange)}
.kpi .k-delta{font-size:11px;font-weight:600}
.k-delta.up{color:var(--ok)} .k-delta.down{color:var(--danger)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.4px;
  padding:3px 8px;border-radius:20px;border:1px solid transparent;white-space:nowrap;text-transform:uppercase}
.badge.pri-HIGH{background:rgba(244,180,34,.14);color:var(--orange);border-color:rgba(244,180,34,.4)}
.badge.pri-MEDIUM{background:rgba(192,160,98,.14);color:var(--gold);border-color:var(--gold-line)}
.badge.pri-WATCH{background:rgba(147,149,152,.14);color:var(--silver-faded);border-color:var(--line-strong)}
.badge.pri-LOW{background:rgba(110,111,114,.14);color:var(--tx-2);border-color:var(--line)}
.badge.soft{background:var(--bg-3);color:var(--tx-1);border-color:var(--line)}
.badge.stage{background:var(--bg-3);color:var(--tx-1);border:1px solid var(--line-strong)}
.badge.ok{background:rgba(127,176,138,.14);color:var(--ok);border-color:rgba(127,176,138,.35)}
.badge.danger{background:rgba(201,122,109,.14);color:var(--danger);border-color:rgba(201,122,109,.35)}
.badge.rel{font-size:9.5px}
.rel-CONFIRMED{background:rgba(127,176,138,.16);color:var(--ok)}
.rel-LIKELY{background:rgba(192,160,98,.16);color:var(--gold)}
.rel-POSSIBLE{background:rgba(147,149,152,.14);color:var(--silver-faded)}
.rel-NOT_RELEVANT{background:rgba(110,111,114,.14);color:var(--tx-3)}
.rel-UNKNOWN{background:rgba(110,111,114,.14);color:var(--tx-3)}

/* score chip */
.score{display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;
  min-width:40px;height:26px;border-radius:7px;padding:0 6px}
.score.s-hi{background:linear-gradient(135deg,rgba(244,180,34,.9),rgba(192,160,98,.9));color:#231c07}
.score.s-md{background:rgba(192,160,98,.2);color:var(--gold-faded);border:1px solid var(--gold-line)}
.score.s-lo{background:var(--bg-3);color:var(--tx-1);border:1px solid var(--line)}
.mini-bar{height:5px;border-radius:3px;background:var(--bg-3);overflow:hidden;min-width:56px}
.mini-bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--orange))}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-1)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
table.tbl th{position:sticky;top:0;background:var(--bg-2);text-align:left;font-size:11px;letter-spacing:.5px;
  text-transform:uppercase;color:var(--tx-2);font-weight:600;padding:11px 13px;border-bottom:1px solid var(--line-strong);
  cursor:pointer;white-space:nowrap}
table.tbl th.no-sort{cursor:default}
table.tbl td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tbody tr{cursor:pointer;transition:.1s}
table.tbl tbody tr:hover{background:var(--bg-2)}
table.tbl tbody tr:last-child td{border-bottom:0}
.cell-main{font-weight:600;color:var(--tx-0)}
.cell-sub{font-size:11.5px;color:var(--tx-2)}
.th-arrow{opacity:.5;font-size:9px}

/* filters */
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
.select,.txtin{background:var(--bg-2);border:1px solid var(--line);color:var(--tx-1);border-radius:8px;
  padding:7px 10px;font-size:12.5px;font-family:inherit;outline:none}
.select:focus,.txtin:focus{border-color:var(--gold-line)}
.chip-btn{background:var(--bg-2);border:1px solid var(--line);color:var(--tx-1);border-radius:20px;
  padding:6px 13px;font-size:12px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.chip-btn:hover{border-color:var(--gold-line)}
.chip-btn.on{background:var(--gold);color:#1c1c14;border-color:var(--gold)}
.btn{background:var(--gold);color:#1c1c14;border:0;border-radius:8px;padding:8px 15px;font-weight:600;
  font-size:12.5px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--bg-2);color:var(--tx-1);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold-line);color:var(--gold)}
.btn.sm{padding:6px 11px;font-size:11.5px}
.count-pill{font-size:12px;color:var(--tx-2);margin-left:auto}

/* pipeline / kanban */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}
.kcol{flex:0 0 262px;background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);
  display:flex;flex-direction:column;max-height:calc(100vh - 250px)}
.kcol .khead{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;background:var(--bg-1);border-radius:var(--radius) var(--radius) 0 0}
.kcol .khead .kt{font-size:12px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--tx-1)}
.kcol .kbody{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;flex:1}
.kcard{background:var(--bg-2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;
  padding:11px;cursor:pointer;transition:.12s}
.kcard:hover{border-color:var(--gold-line);transform:translateY(-1px)}
.kcard.p-HIGH{border-left-color:var(--orange)} .kcard.p-MEDIUM{border-left-color:var(--gold)}
.kcard.p-WATCH{border-left-color:var(--silver)} .kcard.p-LOW{border-left-color:var(--pri-low)}
.kcard .knm{font-size:12.5px;font-weight:600;line-height:1.3;margin-bottom:6px}
.kcard .kmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--tx-2)}
.kcard .krow{display:flex;justify-content:space-between;align-items:center;margin-top:8px}

/* detail */
.detail-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line-strong)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;
  background:var(--bg-1);border:2px solid var(--gold)}
.tl-item.neg::before{border-color:var(--danger)}
.tl-date{font-size:11px;color:var(--tx-3);font-weight:600;letter-spacing:.3px}
.tl-title{font-size:13.5px;font-weight:600;margin:2px 0 3px}
.tl-body{font-size:12.5px;color:var(--tx-1)}
.tl-src{font-size:11px;color:var(--tx-2);margin-top:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--tx-2)} .kv dd{margin:0;color:var(--tx-0)}
.stat-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat-line:last-child{border-bottom:0}
.stat-line .lab{color:var(--tx-2)}

/* map */
#map{height:calc(100vh - 230px);min-height:420px;border-radius:var(--radius);border:1px solid var(--line)}
.leaflet-popup-content-wrapper{background:var(--bg-2);color:var(--tx-0);border-radius:9px}
.leaflet-popup-tip{background:var(--bg-2)}
.leaflet-popup-content{margin:12px 14px;font-family:var(--font)}
.map-legend{background:var(--bg-1);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px}
.map-legend .lg{display:flex;align-items:center;gap:8px;margin:4px 0}
.map-legend .mk{width:12px;height:12px;border-radius:50%}

/* changes feed */
.change-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.change-item:last-child{border-bottom:0}
.change-ic{width:34px;height:34px;border-radius:9px;flex:0 0 34px;display:grid;place-items:center;
  background:var(--bg-3);color:var(--gold)}
.change-ic.orange{color:var(--orange)} .change-ic.danger{color:var(--danger)} .change-ic.ok{color:var(--ok)}
.change-main{flex:1}
.change-main .ct{font-size:13.5px;font-weight:600}
.change-main .cs{font-size:12px;color:var(--tx-2);margin-top:2px}

/* progress bars for scoring */
.pbar{display:flex;align-items:center;gap:10px;margin:9px 0}
.pbar .pl{width:150px;font-size:12.5px;color:var(--tx-1)}
.pbar .pt{flex:1;height:8px;border-radius:5px;background:var(--bg-3);overflow:hidden}
.pbar .pt > i{display:block;height:100%;border-radius:5px}
.pbar .pv{width:38px;text-align:right;font-weight:700;font-size:12.5px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,10,11,.72);backdrop-filter:blur(3px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:30px}
.modal-bg.show{display:flex}
.modal{background:var(--bg-1);border:1px solid var(--line-strong);border-radius:var(--radius-lg);
  max-width:920px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);position:relative}
.modal .mclose{position:absolute;right:14px;top:14px;z-index:2}
.modal-head{padding:22px 26px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;
  background:linear-gradient(180deg,var(--bg-2),var(--bg-1));border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.modal-body{padding:20px 26px 28px}

/* guide */
.guide h2{color:var(--gold);margin:26px 0 8px;font-size:17px}
.guide h3{margin:20px 0 6px;font-size:14.5px}
.guide p{color:var(--tx-1);max-width:820px}
.guide code{background:var(--bg-3);padding:1px 6px;border-radius:5px;font-size:12.5px;color:var(--gold-faded)}
.formula{background:var(--bg-2);border:1px solid var(--gold-line);border-radius:var(--radius);padding:16px 18px;
  margin:14px 0;font-size:13.5px}
.formula b{color:var(--gold)}
.tag-list{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}

/* empty / misc */
.empty{text-align:center;padding:48px 20px;color:var(--tx-3)}
.muted{color:var(--tx-2)} .small{font-size:12px} .mono{font-variant-numeric:tabular-nums}
.right{text-align:right} .center{text-align:center} .nowrap{white-space:nowrap}
.flex{display:flex;gap:10px;align-items:center} .wrap{flex-wrap:wrap}
.hr{height:1px;background:var(--line);margin:16px 0;border:0}
.hl{background:rgba(244,180,34,.28);border-radius:3px;padding:0 2px;color:var(--white)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg-3);
  border:1px solid var(--gold-line);color:var(--tx-0);padding:11px 18px;border-radius:10px;font-size:13px;
  box-shadow:var(--shadow);z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

@media (max-width:1100px){.detail-grid{grid-template-columns:1fr}}
@media (max-width:860px){
  :root{--sidebar-w:0px}
  .sidebar{position:fixed;z-index:60;width:236px;height:100vh;transform:translateX(-100%);transition:.2s}
  .sidebar.open{transform:none}
  .app{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}
}

/* ---- map markers, popups, detail photo (wiki enrichment) ---------------- */
.cm-marker{background:transparent;border:0}
.leaflet-popup.cm-popup .leaflet-popup-content-wrapper{padding:0;overflow:hidden;border-radius:12px;border:1px solid var(--line-strong)}
.leaflet-popup.cm-popup .leaflet-popup-content{margin:0;width:240px!important;line-height:1.4}
.leaflet-popup.cm-popup .leaflet-popup-tip{background:var(--bg-2)}
.pop-img{height:118px;background:#26262b center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#54555a}
.pop-b{padding:11px 13px 12px}
.pop-t{font-weight:700;font-size:13.5px;line-height:1.25;color:var(--tx-0)}
.pop-s{font-size:12px;color:var(--tx-1);margin-top:3px}
.pop-m{font-size:11.5px;color:var(--tx-2);margin-top:3px}
.pop-r{display:flex;gap:8px;align-items:center;margin-top:9px}
.pop-links{display:flex;gap:14px;margin-top:11px;flex-wrap:wrap}
.pop-links a{font-size:12px;font-weight:600;color:var(--gold);display:inline-flex;gap:4px;align-items:center}
.pop-wiki{display:inline-block;margin-top:9px;font-size:11px;color:var(--tx-3)}
.det-photo{height:200px;background:#26262b center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#54555a}
.det-credit{padding:6px 12px;font-size:10.5px;background:var(--bg-2)}
.det-credit a{color:var(--tx-3)}

</style>
</head>

      formula: "Opportunity score = <b>35%</b> · architectural relevance + <b>45%</b> · project maturity + <b>10%</b> · estimated value + <b>10%</b> · information freshness",
      formula_note: "Weights are configurable in Administration. The ideal moment to engage is when maturity is high (tender/award) BUT the material specification is not yet fixed — that is when relevance can be influenced.",

      h_status: "Statuses and events",
      status: "Every project moves through detailed statuses (EARLY_SIGNAL → COMPLETED). Each change is recorded as an event with date, source and evidence. The AI never overwrites a human-confirmed status — it creates a “status-change proposal” the operator accepts or rejects.",

      evidence: "Every piece of information is tied to a source, a date and an evidence excerpt. Original sources are always openable — evidence is never hidden behind the AI summary. Sources are classified by reliability (1 = official document, 7 = unverified mention); a weak source never auto-sets a certain status.",

  const g = G[lang] || G.ro;

  return `<div class="page-title"><div class="cap">Color Metal</div><h1>${g.title}</h1></div>
    <div class="page-sub">${g.sub}</div>

      <p style="font-size:15px;color:var(--tx-0)">${g.intro}</p>

      ${p(g.h_status, g.status)}

<script>
/* Client-side Wikimedia enrichment (runs in the USER's browser, CORS via origin=*).
   Fetches a representative photo (Wikimedia Commons thumbnail) and precise coordinates
   for each monument, so the map dots sit where the sites really are and every popup /
   detail can show a picture. Nothing is fetched server-side; images are loaded by the
   viewer's browser directly from Wikimedia (CC/PD content, credited to Wikipedia).

   Two strategies:
     * batchByTitles(lang, monuments)  — cheap: 50 exact titles per request (coords+thumb)
     * lookup(m)                       — robust: full-text search RO→HU→EN for one monument
*/
window.CM_WIKI = (function () {
  const cache = {};                 // monument.id -> {thumb, lat, lng, pageUrl, title, lang}
  const inflight = {};

  function apiBase(lang) { return "https://" + lang + ".wikipedia.org/w/api.php"; }

  function parsePage(p, lang) {
    if (!p || p.missing !== undefined) return {};
    const out = {};
    if (p.thumbnail && p.thumbnail.source) out.thumb = p.thumbnail.source;
    if (p.coordinates && p.coordinates[0]) { out.lat = p.coordinates[0].lat; out.lng = p.coordinates[0].lon; }
    out.title = p.title;
    out.pageUrl = p.fullurl || ("https://" + lang + ".wikipedia.org/wiki/" + encodeURIComponent((p.title || "").replace(/ /g, "_")));
    out.lang = lang;
    return out;
  }

  // Cheap batch: up to 50 exact titles per call. Good for unambiguous names.
  async function batchByTitles(lang, monuments) {
    const chunks = [];
    for (let i = 0; i < monuments.length; i += 45) chunks.push(monuments.slice(i, i + 45));
    for (const chunk of chunks) {
      const titles = chunk.map(m => (lang === "hu" && m.name_hu) ? m.name_hu : m.official_name);
      const url = apiBase(lang) + "?action=query&format=json&origin=*&redirects=1"
        + "&prop=pageimages|coordinates|info&piprop=thumbnail&pithumbsize=520&inprop=url"
        + "&titles=" + encodeURIComponent(titles.join("|"));
      let data;
      try { data = await fetch(url).then(r => r.json()); } catch (e) { continue; }
      const pages = data && data.query && data.query.pages;
      if (!pages) continue;
      // map normalized titles back to monuments
      const byTitle = {};
      Object.values(pages).forEach(p => { if (p.title) byTitle[p.title.toLowerCase()] = p; });
      const norm = data.query.normalized || [];
      const normMap = {}; norm.forEach(n => normMap[n.from.toLowerCase()] = n.to.toLowerCase());
      chunk.forEach((m, i) => {
        if (cache[m.id] && cache[m.id].thumb) return;
        let key = titles[i].toLowerCase(); key = normMap[key] || key;
        const p = byTitle[key];
        if (!p) return;
        const info = parsePage(p, lang);
        if (info.thumb || info.lat) cache[m.id] = Object.assign(cache[m.id] || {}, info);
      });
    }
  }

  // Robust single lookup via full-text search, RO -> HU -> EN.
  async function lookup(m) {
    if (cache[m.id] && (cache[m.id].thumb || cache[m.id]._done)) return cache[m.id];
    if (inflight[m.id]) return inflight[m.id];
    const run = (async () => {
      const attempts = [["ro", m.official_name + " " + (m.locality || "")]];
      if (m.name_hu) attempts.push(["hu", m.name_hu + " " + (m.locality || "")]);
      attempts.push(["en", m.official_name + " " + (m.locality || "")]);
      let out = cache[m.id] || {};
      for (const [lang, q] of attempts) {
        if (out.thumb && out.lat) break;
        const url = apiBase(lang) + "?action=query&format=json&origin=*&redirects=1"
          + "&generator=search&gsrlimit=1&gsrnamespace=0&gsrsearch=" + encodeURIComponent(q)
          + "&prop=pageimages|coordinates|info&piprop=thumbnail&pithumbsize=520&inprop=url";
        let data;
        try { data = await fetch(url).then(r => r.json()); } catch (e) { continue; }
        const pages = data && data.query && data.query.pages;
        if (!pages) continue;
        const info = parsePage(Object.values(pages)[0], lang);
        if (info.thumb && !out.thumb) { out.thumb = info.thumb; out.title = info.title; out.pageUrl = info.pageUrl; out.lang = lang; }
        if (info.lat && out.lat == null) { out.lat = info.lat; out.lng = info.lng; }
      }
      out._done = true;
      cache[m.id] = out;
      return out;
    })();
    inflight[m.id] = run;
    const r = await run; delete inflight[m.id];
    return r;
  }

  return { cache, batchByTitles, lookup };
})();

</script>
<script>
/* ==========================================================================
   CM Monument Tracker — application logic (vanilla JS, no build step).
   Consumes window.CM_SEED (data) and window.CM_I18N (localization).
   ========================================================================== */
(function () {
  "use strict";
  const D = window.CM_SEED, I18N = window.CM_I18N;

  // ---- state -------------------------------------------------------------
  const S = {
    lang: localStorageSafe("cm_lang") || "ro",
    role: "admin",
    route: "dashboard",
    param: null,
    followed: new Set(D.projects.filter(p => p.followed).map(p => p.id)),
    filters: {},
    listSort: { key: "opportunity_score", dir: -1 },
    pipeView: "kanban",
    showIrrelevant: false,
    interpreted: null,
  };
  function localStorageSafe(k){ try{return null;}catch(e){return null;} } // storage APIs intentionally unused

  // ---- indexes -----------------------------------------------------------
  const monById = Object.fromEntries(D.monuments.map(m => [m.id, m]));
  const prjById = Object.fromEntries(D.projects.map(p => [p.id, p]));
  const evtById = Object.fromEntries(D.events.map(e => [e.id, e]));
  const countyByCode = Object.fromEntries(D.counties.map(c => [c.code, c]));
  const statusById = Object.fromEntries(D.statuses.map(s => [s.id, s]));
  const kanbanCols = D.kanban_columns;
  const productById = Object.fromEntries(D.product_groups.map(g => [g.id, g]));
  const projectsByMon = {};
  D.projects.forEach(p => p.monument_ids.forEach(mid => (projectsByMon[mid] = projectsByMon[mid] || []).push(p)));

  // ---- i18n --------------------------------------------------------------
  function t(k){ return (I18N[S.lang] && I18N[S.lang][k]) || (I18N.ro[k]) || k; }
  function LBL(obj, base){ // pick label_ro/hu/en
    return obj[base + "_" + S.lang] || obj[base + "_ro"] || obj[base] || "";
  }
  function loc(obj, field){ // localized data field: <field>_hu / <field>_en fallback to base
    if(!obj) return "";
    return (S.lang !== "ro" && obj[field + "_" + S.lang]) || obj[field] || "";
  }
  function typeLabel(typ){ const tl=(D.type_labels||{})[typ]; return tl ? (tl[S.lang]||tl.ro) : typ; }
  function lastWeeklyRun(){ return D.weekly_runs.find(r=>!r.manual) || D.weekly_runs[0]; }

  // ---- helpers -----------------------------------------------------------
  const norm = s => (s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/\s+/g," ").trim().toLowerCase();
  const esc = s => (s == null ? "" : String(s)).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const county = code => countyByCode[code] ? countyByCode[code].name : code;
  let TODAY = new Date(D.meta.today + "T12:00:00");

  function fmtMoney(v){ if(v==null) return t("none");
    if(v>=1e6) return (v/1e6).toLocaleString(S.lang,{maximumFractionDigits:1}) + " mil. " + t("ron");
    return v.toLocaleString(S.lang) + " " + t("ron"); }
  function fmtDate(iso){ if(!iso) return t("none"); const d=new Date(iso.slice(0,10)+"T12:00:00");
    return d.toLocaleDateString(S.lang,{year:"numeric",month:"short",day:"numeric"}); }
  function relDate(iso){ if(!iso) return t("none");
    const d=new Date(iso.slice(0,10)+"T12:00:00"); const days=Math.round((TODAY-d)/864e5);
    if(days<=0) return t("today"); if(days===1) return t("yesterday");
    if(days<7) return days+" "+t("days_ago");
    return Math.round(days/7)+" "+t("weeks_ago"); }
  function scoreClass(v){ return v>=80?"s-hi":v>=60?"s-md":"s-lo"; }
  function statusLabel(id){ const s=statusById[id]; return s?LBL(s,"label"):id; }
  function stageLabel(id){ const c=kanbanCols.find(k=>k.id===id); return c?LBL(c,"label"):id; }
  function relevanceClass(v){ return v>=70?"HIGH":v>=45?"MEDIUM":v>=25?"WATCH":"LOW"; }

  function ic(name){ return ICONS[name] || ""; }

  // ---- root render -------------------------------------------------------
  const app = document.getElementById("app");
  function render(){
    app.innerHTML = sidebar() + topbar() + `<main class="main" id="main"></main>`;
    const main = document.getElementById("main");
    main.innerHTML = VIEWS[S.route] ? VIEWS[S.route]() : VIEWS.dashboard();
    afterRender();
    document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("active", a.dataset.route===S.route));
  }
  function go(route, param){ S.route=route; S.param=param||null; S.interpreted=null;
    window.location.hash = "#/"+route+(param?("/"+param):""); render();
    document.getElementById("main").scrollTop=0; }

  // ---- sidebar / topbar --------------------------------------------------
  function navItem(route,label,icon,badge){
    return `<a data-route="${route}" data-act="nav"><span class="ic">${ic(icon)}</span>${esc(label)}${
      badge?`<span class="badge ${badge.cls||'soft'}">${badge.text}</span>`:""}</a>`;
  }
  function sidebar(){
    const reviewOpen = D.review_queue.filter(r=>r.state==="open").length;
    const srcErr = D.sources.filter(s=>s.consecutive_errors>0).length;
    return `<aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="${LOGO}" alt="Color Metal"/>
      </div>
      <div style="padding:10px 18px 4px"><div class="brand"><div style="padding:0"><div style="font-weight:700;font-size:14px;letter-spacing:.3px">${t("app_name")}</div><div class="sub">${t("app_sub")}</div></div></div></div>
      <nav class="nav">
        <div class="sect">${t("nav_overview")}</div>
        ${navItem("dashboard",t("dashboard"),"grid")}
        ${navItem("changes",t("changes"),"bell",{text:lastWeeklyRun().events_created,cls:"pri-MEDIUM"})}
        ${navItem("pipeline",t("pipeline"),"columns")}
        ${navItem("map",t("map"),"map")}
        <div class="sect">${t("nav_data")}</div>
        ${navItem("monuments",t("monuments"),"landmark")}
        ${navItem("projects",t("projects"),"folder")}
        <div class="sect">${t("nav_intel")}</div>
        ${navItem("reports",t("reports"),"doc")}
        ${navItem("ai_review",t("ai_review"),"sparkle",{text:reviewOpen,cls:"pri-HIGH"})}
        ${navItem("guide",t("guide"),"book")}
        <div class="sect">${t("nav_admin")}</div>
        ${navItem("sources",t("sources"),"plug",srcErr?{text:srcErr,cls:"danger"}:null)}
        ${navItem("admin",t("admin"),"gear")}
      </nav>
      <div class="sidebar-foot">
        <span class="dot"></span>${t("last_run")}: ${fmtDate(D.meta.last_run)} · 05:30
      </div>
    </aside>`;
  }
  function topbar(){
    const langSeg = Object.keys(I18N).map(k=>`<button data-act="lang" data-lang="${k}" class="${k===S.lang?'active':''}">${k.toUpperCase()}</button>`).join("");
    return `<header class="topbar">
      <button class="icon-btn" data-act="toggle-side" style="display:none">${ic("menu")}</button>
      <div class="search-wrap">
        <span class="si">${ic("search")}</span>
        <input id="globalSearch" placeholder="${esc(t("search_ph"))}" value="${esc(S.searchQ||'')}"/>
        <span class="nlp">${ic("sparkle")} ${t("nlp")}</span>
      </div>
      <div class="spacer"></div>
      <div class="seg">${langSeg}</div>
      <select class="role-sel" data-act="role">
        ${["admin","analyst","sales","viewer"].map(r=>`<option value="${r}" ${r===S.role?'selected':''}>${t("role")}: ${t("role_"+r)}</option>`).join("")}
      </select>
    </header>`;
  }

  // ---- filtering ---------------------------------------------------------
  function relevantMonuments(){ return D.monuments.filter(m=>S.showIrrelevant || m.cm_relevance>=25 || projectsByMon[m.id]); }
  function activeProjects(){ return D.projects.filter(p=>!["COMPLETED","CANCELLED","LOST_OPPORTUNITY"].includes(p.status)); }

  // ---- VIEWS -------------------------------------------------------------
  const VIEWS = {};

  // ---------- Dashboard ----------
  VIEWS.dashboard = function(){
    const run=lastWeeklyRun();
    const relMon=D.monuments.filter(m=>m.cm_relevance>=45).length;
    const highNew=D.projects.filter(p=>p.commercial_priority==="HIGH").length;
    const funded=D.projects.filter(p=>["FUNDING_APPROVED"].includes(p.status)||p.funding_status==="approved").length;
    const inDesign=D.projects.filter(p=>p.stage==="design").length;
    const worksProc=D.projects.filter(p=>p.status==="WORKS_PROCUREMENT").length;
    const reviewOpen=D.review_queue.filter(r=>r.state==="open").length;
    const srcErr=D.sources.filter(s=>s.consecutive_errors>0).length;
    const kpis=[
      ["kpi_total_mon",D.monuments.length,"",""],
      ["kpi_rel_mon",relMon,"accent",""],
      ["kpi_active_proj",activeProjects().length,"",""],
      ["kpi_new_events",run.events_created,"","+"+run.events_created+" "+t("updated")],
      ["kpi_new_high",highNew,"hot",""],
      ["kpi_funded",funded,"accent",""],
      ["kpi_design",inDesign,"",""],
      ["kpi_works_proc",worksProc,"hot",""],
      ["kpi_review",reviewOpen,"",""],
      ["kpi_src_err",srcErr,srcErr?"hot":"",""],
    ].map(([k,v,cls,sub])=>`<div class="kpi ${cls}"><div class="k-lab">${t(k)}</div>
        <div class="k-val">${v}</div><div class="k-sub">${sub||"&nbsp;"}</div></div>`).join("");

    const top=[...D.projects].sort((a,b)=>b.opportunity_score-a.opportunity_score).slice(0,6);
    const runOkBadge = run.status==="success"
      ? `<span class="badge ok">${ic("check")} ${t("run_ok")}</span>`
      : `<span class="badge pri-MEDIUM">${t("run_partial")}</span>`;

    return `${pageTitle(t("dashboard"),t("dash_sub"))}
      ${demoBanner()}
      <div class="flex wrap" style="justify-content:space-between;margin:-6px 0 14px">
        ${runOkBadge}
        <span class="muted small">${t("next_run")}: ${fmtDate(nextFriday())} · 05:30 (Europe/Bucharest)</span>
      </div>
      <div class="kpis">${kpis}</div>

      <div class="section-h"><h2>${t("since_last")}</h2><span class="hint">${fmtDate(D.meta.prev_run)} → ${fmtDate(D.meta.last_run)}</span></div>
      <div class="grid" style="grid-template-columns:1.4fr 1fr">
        <div class="card">${changesFeed(6)}</div>
        <div class="card">${srcStatusMini()}</div>
      </div>

      <div class="section-h"><h2>${t("top_opps")}</h2><a data-act="nav" data-route="pipeline" style="cursor:pointer" class="small">${t("view_all")} →</a></div>
      ${opportunityTable(top)}
    `;
  };

  function opportunityTable(list){
    const rows=list.map(p=>{ const m=monById[p.monument_ids[0]];
      return `<tr data-act="open-project" data-id="${p.id}">
        <td><div class="cell-main">${esc(p.short_name)}</div><div class="cell-sub">${esc(p.funding_program)}</div></td>
        <td>${esc(m.official_name)}<div class="cell-sub">${esc(m.locality)}</div></td>
        <td>${county(m.county)}</td>
        <td><span class="badge stage">${esc(statusLabel(p.status))}</span></td>
        <td><span class="score ${scoreClass(p.opportunity_score)}">${p.opportunity_score}</span></td>
        <td class="nowrap">${relDate(p.last_major_change)}</td>
        <td class="small" style="max-width:230px">${esc(loc(p,"next_step"))}</td>
        <td>${p.internal_owner?esc(p.internal_owner):`<span class="muted">${t("none")}</span>`}</td>

  // ---- map ---------------------------------------------------------------
  let mapObj=null; const markersById={};
  function haversineKm(la1,lo1,la2,lo2){ const R=6371,rad=Math.PI/180;
    const dLa=(la2-la1)*rad, dLo=(lo2-lo1)*rad;
    const a=Math.sin(dLa/2)**2+Math.cos(la1*rad)*Math.cos(la2*rad)*Math.sin(dLo/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }
  function priColor(pr){ return pr?({HIGH:"#F4B422",MEDIUM:"#C0A062",WATCH:"#939598",LOW:"#6E6F72"}[pr.commercial_priority]):"#8a8b8e"; }
  function bestProject(m){ const prj=projectsByMon[m.id]; return prj?[...prj].sort((a,b)=>b.opportunity_score-a.opportunity_score)[0]:null; }
  function dotIcon(color,big){ const sz=big?18:13; return L.divIcon({className:"cm-marker",
    html:`<span style="display:block;width:${sz}px;height:${sz}px;border-radius:50%;background:${color};border:2px solid rgba(255,255,255,.9);box-shadow:0 1px 5px rgba(0,0,0,.55)"></span>`,
    iconSize:[sz,sz], iconAnchor:[sz/2,sz/2], popupAnchor:[0,-sz/2-1]}); }
  function mapPopupHTML(m){
    const pr=bestProject(m); const w=(window.CM_WIKI&&CM_WIKI.cache[m.id])||{};
    const img = w.thumb
      ? `<div class="pop-img" style="background-image:url('${esc(w.thumb)}')"></div>`
      : `<div class="pop-img ph">${ic("landmark")}</div>`;
    const addr=[m.address,m.locality,county(m.county)].filter(Boolean).join(", ");
    return `<div class="pop">${img}<div class="pop-b">
      <div class="pop-t">${esc(m.official_name)}</div>
      <div class="pop-s">${esc(addr)}</div>
      <div class="pop-m">${esc(typeLabel(m.type))}${m.dating?" · "+esc(m.dating):""}</div>
      ${pr?`<div class="pop-r"><span class="badge stage">${esc(statusLabel(pr.status))}</span><span class="score ${scoreClass(pr.opportunity_score)}">${pr.opportunity_score}</span></div>`
          :`<div class="pop-m muted">${t("registered_only")}</div>`}
      <div class="pop-links">
        <a data-act="open-monument" data-id="${m.id}" style="cursor:pointer">${ic("landmark")} ${t("overview")}</a>
        ${pr?`<a data-act="open-project" data-id="${pr.id}" style="cursor:pointer">${t("projects")} →</a>`:""}
      </div>
      ${w.pageUrl?`<a class="pop-wiki" href="${esc(w.pageUrl)}" target="_blank" rel="noopener">Wikimedia ↗</a>`:`<span class="pop-wiki muted">${t("loading")}</span>`}
    </div></div>`;
  }
  function initMap(){
    if(typeof L==="undefined"||!L.map){ const el=document.getElementById("map"); if(el) el.innerHTML=`<div class="empty">${ic("map")}<br>${t("map_offline")}</div>`; return; }
    try{
    Object.keys(markersById).forEach(k=>delete markersById[k]);
    const f=S.filters;
    let mons=relevantMonuments();
    if(f.county) mons=mons.filter(m=>m.county===f.county);
    mapObj=L.map("map",{scrollWheelZoom:true}).setView([45.94,25.0],7);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
      {attribution:'© OpenStreetMap, © CARTO · fotó: Wikimedia',maxZoom:19}).addTo(mapObj);
    const layer=(L.markerClusterGroup? L.markerClusterGroup({maxClusterRadius:48,showCoverageOnHover:false,spiderfyOnMaxZoom:true}) : L.layerGroup());
    let count=0; const shown=[];
    mons.forEach(m=>{ const pr=bestProject(m);
      if(f.priority && (!pr || pr.commercial_priority!==f.priority)) return;
      if(f.hasProject==="yes" && !projectsByMon[m.id]) return;
      count++; shown.push(m);
      const w=(window.CM_WIKI&&CM_WIKI.cache[m.id])||{};
      const lat=(w.lat!=null)?w.lat:m.lat, lng=(w.lng!=null)?w.lng:m.lng;
      const mk=L.marker([lat,lng],{icon:dotIcon(priColor(pr),!!pr),title:m.official_name});
      mk.bindPopup(mapPopupHTML(m),{minWidth:232,maxWidth:262,className:"cm-popup"});
      mk.on("popupopen",()=>{ if(!window.CM_WIKI) return; CM_WIKI.lookup(m).then(w2=>{
        if(w2 && w2.lat!=null){ const dk=haversineKm(m.lat,m.lng,w2.lat,w2.lng); if(dk<60) mk.setLatLng([w2.lat,w2.lng]); }
        if(mk.isPopupOpen && mk.isPopupOpen()) mk.setPopupContent(mapPopupHTML(m)); }); });
      markersById[m.id]=mk; layer.addLayer(mk);
    });
    mapObj.addLayer(layer);
    const c=document.getElementById("mapCount"); if(c) c.textContent=count+" "+t("results");
    enrichMap(shown);
    }catch(err){ const el=document.getElementById("map"); if(el) el.innerHTML=`<div class="empty">${t("map_offline")}</div>`; }
  }
  async function enrichMap(mons){
    if(!window.CM_WIKI) return;
    const applyCoords=(list)=>{ list.forEach(m=>{ const w=CM_WIKI.cache[m.id], mk=markersById[m.id];
      if(w && w.lat!=null && mk){ const dk=haversineKm(m.lat,m.lng,w.lat,w.lng); if(dk<60) mk.setLatLng([w.lat,w.lng]); } }); };
    try{
      await CM_WIKI.batchByTitles("ro", mons); applyCoords(mons);
      const missing=mons.filter(m=>m.name_hu && !(CM_WIKI.cache[m.id]&&CM_WIKI.cache[m.id].thumb && CM_WIKI.cache[m.id].lat!=null));
      if(missing.length){ await CM_WIKI.batchByTitles("hu", missing); applyCoords(missing); }
    }catch(e){}
  }
  function miniMap(id,mons){ if(typeof L==="undefined"||!L.map)return; const el=document.getElementById(id); if(!el)return; try{
    const m0=mons[0]; const w=(window.CM_WIKI&&CM_WIKI.cache[m0.id])||{};
    const lat=(w.lat!=null)?w.lat:m0.lat, lng=(w.lng!=null)?w.lng:m0.lng;
    const mm=L.map(id,{zoomControl:false,attributionControl:false,scrollWheelZoom:false,dragging:true}).setView([lat,lng],13);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:19}).addTo(mm);
    const mk=L.marker([lat,lng],{icon:dotIcon("#C0A062",true)}).addTo(mm);
    if(window.CM_WIKI) CM_WIKI.lookup(m0).then(w2=>{ if(w2&&w2.lat!=null){ const dk=haversineKm(m0.lat,m0.lng,w2.lat,w2.lng); if(dk<60){ mm.setView([w2.lat,w2.lng],14); mk.setLatLng([w2.lat,w2.lng]); } } });
    }catch(err){}
  }
  window.__openPrj=id=>{ closeModal(); openProject(id); };

  // ---- natural-language search ------------------------------------------
  function runSearch(q){
    S.searchQ=q; const nq=norm(q);
    if(!nq){ return; }
    const interp={};
    // county
    D.counties.forEach(c=>{ if(nq.includes(norm(c.name))) interp.county=c.code; });
    if(/transilvania|erdely|ardeal/.test(nq)) interp.region="Transilvania";
    // type
    const typeMap={castel:"castel",castele:"castel",kastely:"castel",biseric:"biserică",templom:"biserică",
      palat:"palat",cetate:"cetate",var:"cetate",manastire:"mănăstire",teatru:"teatru"};
    Object.keys(typeMap).forEach(k=>{ if(nq.includes(k)) interp.type=typeMap[k]; });
    // status / funding
    if(/finantare aprobata|aprobat|jovahagyott|approved funding/.test(nq)) interp.funding="approved";
    if(/proiectare|tervezes|in design/.test(nq)) interp.stage="design";
    if(/licitat|tender|kozbeszerz/.test(nq)) interp.stage_any=["procurement"];
    if(/fara responsabil|nincs felelos|without owner|no owner/.test(nq)) interp.noOwner=true;
    // score threshold
    const sm=nq.match(/(peste|over|felett|>)\s*(\d{2})/); if(sm) interp.minScore=parseInt(sm[2]);
    // product/material
    const prodMap={cupru:"cupru_tabla",copper:"cupru_tabla",rez:"cupru_tabla",zinc:"titan_zinc",titan:"titan_zinc",
      aluminiu:"aluminiu_tabla",acoperis:"sistem_pluvial",invelitoare:"faltuit",tetofedes:"faltuit"};
    Object.keys(prodMap).forEach(k=>{ if(nq.includes(k)) interp.product=prodMap[k]; });
    if(/aceasta saptamana|ezen a heten|this week/.test(nq)) interp.thisWeek=true;

    // apply against projects
    let res=D.projects.filter(p=>{ const m=monById[p.monument_ids[0]];
      if(interp.county && m.county!==interp.county) return false;
      if(interp.type && m.type!==interp.type) return false;
      if(interp.funding==="approved" && !(p.status==="FUNDING_APPROVED"||p.funding_status==="approved")) return false;
      if(interp.stage && p.stage!==interp.stage) return false;
      if(interp.stage_any && !interp.stage_any.includes(p.stage)) return false;
      if(interp.noOwner && p.internal_owner) return false;
      if(interp.minScore && p.opportunity_score<interp.minScore) return false;
      if(interp.product && !p.potential_products.some(pp=>pp.group===interp.product)) return false;
      if(interp.thisWeek && daysBetween(p.last_major_change,D.meta.last_run)>8) return false;
      if(interp.region==="Transilvania" && !TRANSILVANIA.includes(m.county)) return false;
      // free-text fallback
      if(Object.keys(interp).length===0 && !norm(p.name+" "+m.official_name+" "+m.locality).includes(nq)) return false;
      return true;
    });
    if(Object.keys(interp).length===0){ // also match monuments by name -> open list
      const mres=D.monuments.filter(m=>norm(m.official_name+" "+m.locality+" "+(m.name_hu||"")).includes(nq));
      if(mres.length===1 && res.length===0){ openMonument(mres[0].id); return; }
    }
    showSearchResults(q,interp,res);
  }
  function showSearchResults(q,interp,res){
    const chips=[];
    if(interp.county) chips.push(`${t("f_county")}: ${county(interp.county)}`);
    if(interp.region) chips.push(interp.region);
    if(interp.type) chips.push(`${t("col_type")}: ${interp.type}`);
    if(interp.funding) chips.push(t("new_funding")+": approved");
    if(interp.stage) chips.push(`${t("col_status")}: ${stageLabel(interp.stage)}`);
    if(interp.stage_any) chips.push(`${t("col_status")}: ${interp.stage_any.map(stageLabel).join("/")}`);
    if(interp.noOwner) chips.push(t("col_owner")+": —");
    if(interp.minScore) chips.push(`${t("opp_score")} ≥ ${interp.minScore}`);
    if(interp.product) chips.push(`${t("col_product")}: ${LBL(productById[interp.product]||{}, "label")}`);
    if(interp.thisWeek) chips.push(t("changes"));
    const body=`
      <div class="card" style="margin-bottom:14px;background:var(--bg-2)">
        <div class="small muted">${t("nlp")} · „${esc(q)}"</div>
        <div class="tag-list" style="margin-top:8px">${chips.length?chips.map(c=>`<span class="badge pri-MEDIUM">${esc(c)}</span>`).join(""):`<span class="muted small">${t("search_in")}</span>`}</div>
      </div>
      ${res.length?opportunityTable(res.sort((a,b)=>b.opportunity_score-a.opportunity_score)):`<div class="empty">${t("no_results")}</div>`}`;
    showModal(t("nlp"), res.length+" "+t("results"), body);
  }
  const TRANSILVANIA=["CJ","BV","SB","MS","HR","CV","AB","BN","SJ","MM","SM","BH","HD","AR","CS","TM"];

  // ---- CSV export --------------------------------------------------------
  function exportCsv(rows,name){
    const csv=rows.map(r=>r.map(c=>`"${String(c==null?"":c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  }

  // ---- events ------------------------------------------------------------
  function afterRender(){
    const gs=document.getElementById("globalSearch");
    if(gs) gs.addEventListener("keydown",e=>{ if(e.key==="Enter") runSearch(gs.value); });
    if(S.route==="map") setTimeout(initMap,40);
  }
  function runNow(){
    const steps = t("run_steps");
    const started = new Date();
    showModal(t("run_modal"), started.toLocaleString(S.lang), `<div id="runSteps"></div>`);
    let i = 0;
    const tick = () => {
      const el = document.getElementById("runSteps");
      if (!el) return;                       // modal closed by the user
      if (i < steps.length) {
        el.innerHTML += `<div class="stat-line"><span class="lab">${String(i+1).padStart(2,"0")}. ${esc(steps[i])}</span><b style="color:var(--ok)">✓</b></div>`;
        i++; setTimeout(tick, 80); return;
      }
      const now = new Date(); let changed = 0;
      const w = D.meta.scoring_weights;
      D.projects.forEach(p => {
        const lc = new Date((p.last_major_change||D.meta.today) + "T12:00:00");
        const days = Math.max(0, Math.round((now - lc) / 864e5));
        const fresh = Math.max(0, Math.round(100 - days / 3.65));
        const vn = p.estimated_value ? Math.min(100, Math.round(Math.log10(p.estimated_value + 1) / 8 * 100)) : 0;
        const sc = Math.round(w.arch*p.architectural_relevance + w.maturity*p.project_maturity + w.value*vn + w.freshness*fresh);
        if (sc !== p.opportunity_score) changed++;
        p.opportunity_score = sc;
        p.commercial_priority = sc >= 80 ? "HIGH" : sc >= 60 ? "MEDIUM" : sc >= 40 ? "WATCH" : "LOW";
      });
      const iso = now.toISOString().slice(0, 10);
      D.meta.last_run = iso; TODAY = now;
      D.weekly_runs.unshift({ id: "run-" + iso + "-manual", manual: true,
        started_at: started.toISOString(), finished_at: now.toISOString(),
        duration_s: Math.max(1, Math.round((now - started) / 1000)),
        sources_processed: D.sources.filter(x => x.active).length, sources_failed: 0,
        new_documents: 0, changed_documents: 0, events_created: 0, uncertain_matches: 0,
        ai_tokens: 0, ai_cost_usd: 0, status: "success", report_path: null });
      D.sources.forEach(x => { if (x.active) x.last_success = iso; });
      el.innerHTML += `<div class="hr"></div><b style="color:var(--gold)">${esc(t("run_done"))}</b>
        <div class="muted small" style="margin-top:6px">${D.projects.length} ${t("projects").toLowerCase()} · ${changed} ${t("run_changed")}</div>
        <p class="muted small" style="margin-top:8px">${esc(t("run_note"))}</p>`;
      toast(t("run_done"));
    };
    tick();
  }
  function toast(msg){ let el=document.getElementById("toast");
    if(!el){el=document.createElement("div");el.id="toast";el.className="toast";document.body.appendChild(el);}
    el.textContent=msg; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2600); }

  document.addEventListener("click",e=>{
    const a=e.target.closest("[data-act]"); if(!a) return; const act=a.dataset.act;
    switch(act){
      case "nav": go(a.dataset.route); break;
      case "lang": S.lang=a.dataset.lang; render(); break;
      case "role": break;
      case "open-monument": openMonument(a.dataset.id); break;
      case "open-project": openProject(a.dataset.id); break;
      case "close-modal": closeModal(); break;
      case "filter": { const sel=a; S.filters[sel.dataset.key]=sel.value; render(); break; }
      case "reset-filters": S.filters={}; S.listSearch=""; S.showIrrelevant=false; render(); break;
      case "toggle-irrelevant": S.showIrrelevant=!S.showIrrelevant; render(); break;
      case "toggle-followed": S.filters.followed=S.filters.followed==="yes"?"":"yes"; render(); break;
      case "toggle-side": document.getElementById("sidebar").classList.toggle("open"); break;
      case "pipe-view": S.pipeView=a.dataset.v; render(); break;
      case "map-proj-only": S.filters.hasProject=S.filters.hasProject==="yes"?"":"yes"; render(); break;
      case "sort": { const k=a.dataset.key; if(S.listSort.key===k)S.listSort.dir*=-1;else S.listSort={key:k,dir:-1}; render(); break; }
      case "follow": { const id=a.dataset.id; if(S.followed.has(id))S.followed.delete(id);else S.followed.add(id);
        toast(t("toast_demo")); if(document.getElementById("modalBg")&&document.getElementById("modalBg").classList.contains("show"))openProject(id);else render(); break; }
      case "run-now": runNow(); break;
      case "review-demo": toast(t("toast_demo")); break;
      case "open-report": case "download-report": case "download": toast(t("toast_demo")); break;
      case "export-mon": exportCsv([["LMI","Name","County","Locality","Type","Group","Condition","Relevance"],
        ...relevantMonuments().map(m=>[m.lmi_code,m.official_name,county(m.county),m.locality,m.type,m.lmi_group,m.physical_condition,m.cm_relevance])],
        "monumente.csv"); break;
      case "export-prj": exportCsv([["Project","Monument","County","Status","EstValue","Score","Priority","Owner"],
        ...D.projects.map(p=>{const m=monById[p.monument_ids[0]];return [p.name,m.official_name,county(m.county),p.status,p.estimated_value,p.opportunity_score,p.commercial_priority,p.internal_owner||""];})],
        "proiecte.csv"); break;
    }
  });
  document.addEventListener("change",e=>{
    const a=e.target.closest("[data-act]"); if(!a)return;
    if(a.dataset.act==="role"){ S.role=a.value; toast(t("role")+": "+t("role_"+a.value)); }
    if(a.dataset.act==="filter"){ S.filters[a.dataset.key]=a.value; render(); }
  });
  document.addEventListener("input",e=>{
    const a=e.target.closest("[data-act='list-search']"); if(a){ S.listSearch=a.value; const main=document.getElementById("main");
      const pos=a.selectionStart; render(); const ni=document.querySelector("[data-act='list-search']"); if(ni){ni.focus();ni.setSelectionRange(pos,pos);} }
  });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

  // ---- boot --------------------------------------------------------------
  function boot(){
    const h=window.location.hash.replace(/^#\//,"").split("/");
    if(h[0]&&VIEWS[h[0]]) S.route=h[0];
    render();
    if(h[0]==="monument"&&h[1]) openMonument(h[1]);
    if(h[0]==="project"&&h[1]) openProject(h[1]);
  }

  // icons + logo + guide are injected from generated globals
  const ICONS=window.CM_ICONS||{}; const LOGO=window.CM_LOGO||"";
  function guideContent(){ return window.CM_GUIDE ? window.CM_GUIDE(S.lang,t) : ""; }

  window.CM_APP={boot,go};
  document.addEventListener("DOMContentLoaded",boot);
  if(document.readyState!=="loading") boot();
})();

</script>
